<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de parqueo inteligente</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="dashboard-header">
        <h1>Monitoreo de Parqueo Inteligente</h1>
    </div>

    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-title">Espacios Disponibles</div>
            <div class="kpi-value green" id="kpi-disponibles">0</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Espacios Ocupados</div>
            <div class="kpi-value red" id="kpi-ocupados">0</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Estado Talanquera</div>
            <div class="kpi-value" id="kpi-gate" style="color: #38bdf8;">Cerrada</div>
        </div>
    </div>

    <div class="section-title">Estado de Espacios en Tiempo Real</div>
    <div class="parqueos-grid" id="parqueos-container">
    </div>

    <div class="section-title">Bitácora de Eventos</div>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Evento</th>
                    <th>Espacio</th>
                    <th>Descripción</th>
                    <th>Fecha y Hora</th>
                </tr>
            </thead>
            <tbody id="bitacora-container">
            </tbody>
        </table>
    </div>

    <script>
        async function cargarDatos() {
            try {
                // 1. Obtener espacios
                const resEspacios = await fetch('/api/espacios');
                const espacios = await resEspacios.json();
                
                const container = document.getElementById('parqueos-container');
                container.innerHTML = '';
                
                let libres = 0;
                let ocupados = 0;

                espacios.forEach(p => {
                    if (p.estado === 'LIBRE') libres++;
                    if (p.estado === 'OCUPADO') ocupados++;

                    const div = document.createElement('div');
                    div.className = `slot-card ${p.estado.toLowerCase()}`;
                    div.innerHTML = `
                        <div class="slot-title">Espacio ${p.codigo}</div>
                        <div class="slot-status">${p.estado}</div>
                    `;
                    container.appendChild(div);
                });

                // Actualizar contadores superiores
                document.getElementById('kpi-disponibles').innerText = `${libres} / ${espacios.length}`;
                document.getElementById('kpi-ocupados').innerText = ocupados;

                // 2. Obtener estado de la talanquera en tiempo real
                const resTalanquera = await fetch('/api/talanquera');
                const dataTalanquera = await resTalanquera.json();
                const kpiGate = document.getElementById('kpi-gate');
                
                if (kpiGate) {
                    kpiGate.innerText = dataTalanquera.estado;
                    if (dataTalanquera.estado === 'Abierta') {
                        kpiGate.style.color = '#22c55e'; // Verde brillante cuando abre
                    } else {
                        kpiGate.style.color = '#38bdf8'; // Azul por defecto cuando está cerrada
                    }
                }

                // 3. Obtener bitácora
                const resBitacora = await fetch('/api/bitacora');
                const bitacora = await resBitacora.json();
                
                const bitacoraContainer = document.getElementById('bitacora-container');
                bitacoraContainer.innerHTML = '';
                
                bitacora.forEach(b => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${b.tipo_evento}</strong></td>
                        <td>${b.espacio || 'General'}</td>
                        <td>${b.descripcion}</td>
                        <td>${new Date(b.fecha_hora).toLocaleString()}</td>
                    `;
                    bitacoraContainer.appendChild(tr);
                });

            } catch (error) {
                console.error("Error cargando datos:", error);
            }
        }

        // Refresco más rápido (cada 1 segundo) para capturar los 3 segundos de apertura de la talanquera
        setInterval(cargarDatos, 1000);
        cargarDatos();
    </script>
</body>
</html>
